<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
  <style>
    text { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; }
    .hdr  { font-size: 26px; font-weight: bold; fill: #FFFFFF; }
    .lead { font-size: 32px; font-weight: bold; fill: #3B3B5F; }
    .lbl  { font-size: 24px; font-weight: bold; fill: #3B3B5F; }
    .cnt  { font-size: 21px; font-weight: bold; fill: #B0253A; }
    .body { font-size: 23px; fill: #55556E; }
    .colh { font-size: 22px; font-weight: bold; fill: #FFFFFF; }
  </style>

  <rect width="1400" height="1400" fill="#FFFFFF"/>

  <!-- ── title ───────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1400" height="72" fill="#3B3B5F"/>
  <text x="700" y="46" text-anchor="middle" style="font-size:27px;font-weight:bold;fill:#FFFFFF">Benchmarking 62 Text Summarization Methods for Biomedical Literature</text>

  <!-- ── band A: corpus ──────────────────────────────────────── -->
  <rect x="30" y="108" width="1340" height="186" rx="16" fill="#F4F5FB" stroke="#3B3B5F" stroke-width="2.5"/>
  <rect x="70" y="88" width="296" height="40" rx="20" fill="#3B3B5F"/>
  <text x="218" y="117" text-anchor="middle" class="hdr">Benchmark Corpus</text>

  <g stroke="#3B3B5F" stroke-width="2.5" fill="#DCDEEC">
    <rect x="100" y="140" width="94" height="112" rx="6"/>
    <rect x="112" y="152" width="94" height="112" rx="6"/>
    <rect x="124" y="164" width="94" height="112" rx="6" fill="#FFFFFF"/>
  </g>
  <g stroke="#8E8EA8" stroke-width="4.5" stroke-linecap="round">
    <path d="M140 186 H204"/><path d="M140 204 H204"/><path d="M140 222 H186"/>
    <path d="M140 240 H204"/><path d="M140 258 H176"/>
  </g>

  <text x="254" y="190" class="lead">1,000 biomedical abstracts</text>
  <text x="254" y="230" class="body">20 journals · ScienceDirect and Cell Press</text>

  <g stroke="#B0253A" stroke-width="5" fill="#B0253A">
    <path d="M730 201 H834"/>
    <path d="M834 185 L864 201 L834 217 Z" stroke="none"/>
  </g>
  <rect x="900" y="145" width="430" height="112" rx="12" fill="#FAEBEE" stroke="#B0253A" stroke-width="2.5"/>
  <text x="1115" y="191" text-anchor="middle" class="lbl">Author-written highlights</text>
  <text x="1115" y="225" text-anchor="middle" class="body">as reference summaries</text>

  <g fill="#3B3B5F"><path d="M684 302 H716 V336 H730 L700 356 L670 336 H684 Z"/></g>

  <!-- ── band B: models ──────────────────────────────────────── -->
  <rect x="30" y="364" width="1340" height="188" rx="16" fill="#ECEEF8" stroke="#3B3B5F" stroke-width="2.5"/>
  <rect x="70" y="344" width="456" height="40" rx="20" fill="#3B3B5F"/>
  <text x="298" y="373" text-anchor="middle" class="hdr">Summarization Methods (n = 62)</text>
  <rect x="946" y="344" width="384" height="40" rx="20" fill="#B0253A"/>
  <text x="1138" y="373" text-anchor="middle" class="hdr">62,000 generated summaries</text>

  <g fill="#FFFFFF" stroke="#3B3B5F" stroke-width="2.5">
    <rect x="70"   y="400" width="297" height="68" rx="10"/>
    <rect x="391"  y="400" width="297" height="68" rx="10"/>
    <rect x="712"  y="400" width="297" height="68" rx="10"/>
    <rect x="1033" y="400" width="297" height="68" rx="10"/>
  </g>
  <!-- traditional: word-frequency counts -->
  <g fill="#3B3B5F">
    <rect x="139" y="437" width="6" height="10" rx="1"/>
    <rect x="148" y="429" width="6" height="18" rx="1"/>
    <rect x="157" y="421" width="6" height="26" rx="1"/>
  </g>
  <!-- encoder-decoder: bottleneck -->
  <g fill="#3B3B5F">
    <path d="M418 423 L428 429 L428 439 L418 445 Z"/>
    <path d="M434 429 L444 423 L444 445 L434 439 Z"/>
    <rect x="428" y="432.5" width="6" height="3"/>
  </g>
  <!-- small LM: small generated-text bubble -->
  <g stroke="#3B3B5F" stroke-width="2.1" fill="none" stroke-linejoin="round">
    <path d="M795 423 H807 Q811 423 811 427 V434 Q811 438 807 438 H801 L796 444 L797 438 H795 Q791 438 791 434 V427 Q791 423 795 423 Z"/>
    <path d="M795.5 430.5 H806" stroke-width="1.8"/>
  </g>
  <!-- large LM: large generated-text bubble -->
  <g stroke="#3B3B5F" stroke-width="2.1" fill="none" stroke-linejoin="round">
    <path d="M1111 419 H1131 Q1135 419 1135 423 V436 Q1135 440 1131 440 H1122 L1116 448 L1117 440 H1111 Q1107 440 1107 436 V423 Q1107 419 1111 419 Z"/>
    <path d="M1112 426.5 H1130 M1112 433 H1126" stroke-width="1.8"/>
  </g>
  <g class="lbl">
    <text x="179"  y="428">Traditional</text>
    <text x="459"  y="428">Encoder–decoder</text>
    <text x="829"  y="428">Small LM</text>
    <text x="1149" y="428">Large LM</text>
  </g>
  <g class="cnt">
    <text x="179"  y="454">n = 2</text>
    <text x="459"  y="454">n = 11</text>
    <text x="829"  y="454">n = 28</text>
    <text x="1149" y="454">n = 21</text>
  </g>

  <g fill="#FFFFFF" stroke="#B0253A" stroke-width="2.5">
    <rect x="70"  y="484" width="404" height="46" rx="23"/>
    <rect x="498" y="484" width="404" height="46" rx="23"/>
    <rect x="926" y="484" width="404" height="46" rx="23"/>
  </g>
  <g text-anchor="middle" style="font-size:22px;font-weight:bold;fill:#B0253A">
    <text x="272"  y="515">general-purpose</text>
    <text x="700"  y="515">domain-specific</text>
    <text x="1128" y="515">reasoning-oriented</text>
  </g>

  <g fill="#3B3B5F"><path d="M684 560 H716 V594 H730 L700 614 L670 594 H684 Z"/></g>

  <!-- ── band C: evaluation ──────────────────────────────────── -->
  <rect x="30" y="622" width="1340" height="278" rx="16" fill="#E2E5F4" stroke="#3B3B5F" stroke-width="2.5"/>
  <rect x="70" y="602" width="440" height="40" rx="20" fill="#3B3B5F"/>
  <text x="290" y="631" text-anchor="middle" class="hdr">Multi-Metric Evaluation (n = 12)</text>

  <g>
    <rect x="70" y="668" width="404" height="136" rx="10" fill="#FFFFFF" stroke="#3B3B5F" stroke-width="2.5"/>
    <path d="M70 678 Q70 668 80 668 H464 Q474 668 474 678 V712 H70 Z" fill="#3B3B5F"/>
    <text x="272" y="699" text-anchor="middle" class="colh">LEXICAL  (n = 5)</text>
    <text x="272" y="750" text-anchor="middle" class="body">ROUGE-1 / -2 / -L</text>
    <text x="272" y="784" text-anchor="middle" class="body">BLEU · METEOR</text>
  </g>
  <g>
    <rect x="498" y="668" width="404" height="136" rx="10" fill="#FFFFFF" stroke="#3B3B5F" stroke-width="2.5"/>
    <path d="M498 678 Q498 668 508 668 H892 Q902 668 902 678 V712 H498 Z" fill="#3B3B5F"/>
    <text x="700" y="699" text-anchor="middle" class="colh">SEMANTIC  (n = 3)</text>
    <text x="700" y="750" text-anchor="middle" class="body">BERTScore</text>
    <text x="700" y="784" text-anchor="middle" class="body">embedding similarity</text>
  </g>
  <g>
    <rect x="926" y="668" width="404" height="136" rx="10" fill="#FFFFFF" stroke="#3B3B5F" stroke-width="2.5"/>
    <path d="M926 678 Q926 668 936 668 H1320 Q1330 668 1330 678 V712 H926 Z" fill="#3B3B5F"/>
    <text x="1128" y="699" text-anchor="middle" class="colh">FACTUAL  (n = 4)</text>
    <text x="1128" y="750" text-anchor="middle" class="body">AlignScore · SummaC</text>
    <text x="1128" y="784" text-anchor="middle" class="body">MiniCheck</text>
  </g>

  <rect x="70" y="824" width="574" height="54" rx="10" fill="#FFFFFF" stroke="#3B3B5F" stroke-width="2.5"/>
  <!-- normalization: normal distribution -->
  <g stroke="#3B3B5F" fill="none" stroke-linecap="round">
    <path d="M205 857.5 H249" stroke-width="2"/>
    <path d="M207 857.1 L209.2 856.6 L211.4 855.8 L213.7 854.6 L215.9 852.9 L218.1 850.8 L220.3 848.6 L222.6 846.5 L224.8 845 L227 844.5 L229.2 845 L231.4 846.5 L233.7 848.6 L235.9 850.8 L238.1 852.9 L240.3 854.6 L242.6 855.8 L244.8 856.6 L247 857.1" stroke-width="2.6" stroke-linejoin="round"/>
  </g>
  <text x="263" y="859" class="lbl">z-score normalization</text>
  <g stroke="#B0253A" stroke-width="5" fill="#B0253A">
    <path d="M654 851 H692"/><path d="M692 835 L722 851 L692 867 Z" stroke="none"/>
  </g>
  <rect x="730" y="824" width="600" height="54" rx="10" fill="#B0253A"/>
  <!-- ranking: leaderboard -->
  <g fill="#FFFFFF">
    <rect x="859" y="839.5" width="27" height="5" rx="2.5"/>
    <rect x="859" y="848.5" width="20" height="5" rx="2.5"/>
    <rect x="859" y="857.5" width="13" height="5" rx="2.5"/>
  </g>
  <text x="901" y="859" style="font-size:24px;font-weight:bold;fill:#FFFFFF">Overall Performance Rank</text>

  <!-- ── validation gate: flanks the elongated arrow ─────────── -->
  <g fill="#3B3B5F"><path d="M684 911 H716 V1011 H730 L700 1031 L670 1011 H684 Z"/></g>

  <g fill="#ECEEF8" stroke="#3B3B5F" stroke-width="2.5">
    <rect x="70"  y="941" width="560" height="60" rx="10"/>
    <rect x="770" y="941" width="560" height="60" rx="10"/>
  </g>
  <!-- expert assessment: clipboard with check -->
  <g stroke="#3B3B5F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="166" y="958" width="28" height="30" rx="3" stroke-width="2.2"/>
    <path d="M173 974 L179 980 L188 967" stroke-width="2.8"/>
  </g>
  <rect x="174.5" y="954" width="11" height="7" rx="2" fill="#3B3B5F"/>
  <text x="210" y="979" class="lbl">Validated by blinded experts</text>
  <!-- LLM-judge panel: balance scales -->
  <g stroke="#3B3B5F" fill="none" stroke-linecap="round">
    <path d="M840 963 H872" stroke-width="2.4"/>
    <path d="M856 958 V985" stroke-width="2.4"/>
    <path d="M845 985 H867" stroke-width="2.6"/>
    <path d="M843.5 963 V965 M868.5 963 V965" stroke-width="1.8"/>
    <path d="M837 965 A 6.5 6.5 0 0 0 850 965" stroke-width="2.2"/>
    <path d="M862 965 A 6.5 6.5 0 0 0 875 965" stroke-width="2.2"/>
  </g>
  <circle cx="856" cy="958" r="2.4" fill="#3B3B5F"/>
  <text x="892" y="979" class="lbl">Validated by an LLM-judge panel</text>

  <!-- ── band D: findings ────────────────────────────────────── -->
  <rect x="30" y="1042" width="1340" height="328" rx="16" fill="#FBEBEE" stroke="#B0253A" stroke-width="3"/>
  <rect x="70" y="1022" width="219" height="40" rx="20" fill="#B0253A"/>
  <text x="180" y="1051" text-anchor="middle" class="hdr">Key Findings</text>

  <g fill="#FFFFFF">
    <rect x="70" y="1082" width="1260" height="50" rx="10"/>
    <rect x="70" y="1140" width="1260" height="50" rx="10"/>
    <rect x="70" y="1198" width="1260" height="50" rx="10"/>
  </g>
  <g fill="#B0253A">
    <circle cx="106" cy="1107" r="15"/><circle cx="106" cy="1165" r="15"/><circle cx="106" cy="1223" r="15"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M99 1107 L104.5 1113.5 L113.5 1101"/>
    <path d="M99 1165 L104.5 1171.5 L113.5 1159"/>
    <path d="M99 1223 L104.5 1229.5 L113.5 1217"/>
  </g>
  <g style="font-size:24px;fill:#3B3B5F">
    <text x="138" y="1115">General-purpose models outperform domain-specific and reasoning-oriented models</text>
    <text x="138" y="1173">Medium-sized models outperform large-scale models</text>
    <text x="138" y="1231">Classical extractive methods lag behind neural approaches</text>
  </g>

  <g fill="#3B3B5F">
    <rect x="70"  y="1262" width="404" height="78" rx="10"/>
    <rect x="498" y="1262" width="404" height="78" rx="10"/>
    <rect x="926" y="1262" width="404" height="78" rx="10"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="116" cy="1301" r="19"/><circle cx="544" cy="1301" r="19"/><circle cx="972" cy="1301" r="19"/>
  </g>
  <g stroke="#B0253A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M107 1301 L114 1309 L126 1293"/>
    <path d="M535 1301 L542 1309 L554 1293"/>
    <path d="M963 1301 L970 1309 L982 1293"/>
  </g>
  <g style="font-size:23px;font-weight:bold;fill:#FFFFFF">
    <text x="150" y="1309">Mistral top-ranked family</text>
    <text x="578" y="1309">Judges match experts</text>
    <text x="1006" y="1309">No data-leakage evidence</text>
  </g>
</svg>
